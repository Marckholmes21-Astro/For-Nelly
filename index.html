<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> 💙 Nelly 💙✨</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI', sans-serif;
}

/* FONDO ESTRELLAS */
.stars{
    position:absolute;
    width:100%;
    height:100%;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:twinkle 4s infinite;
}

@keyframes twinkle{
    50%{
        opacity:.2;
        transform:scale(.5);
    }
}

/* CONTENEDOR */
.container{
    position:relative;
    width:100%;
    height:100%;
}

/* TEXTO SUPERIOR */
.title{
    position:absolute;
    top:60px;
    width:100%;
    text-align:center;
    color:#8fc8ff;
    font-size:4rem;
    font-weight:300;
    letter-spacing:5px;

    text-shadow:
    0 0 10px #4da3ff,
    0 0 25px #4da3ff,
    0 0 50px #4da3ff;

    animation:glow 2.5s infinite alternate;
}

@keyframes glow{
    from{
        opacity:.7;
    }
    to{
        opacity:1;
    }
}

/* CANVAS */
canvas{
    position:absolute;
    inset:0;
}

/* FRASE */
.phrase{
    position:absolute;
    bottom:80px;
    width:100%;
    text-align:center;
    color:rgba(255,255,255,0.75);
    font-size:1rem;
    letter-spacing:2px;

    text-shadow:
    0 0 10px rgba(255,255,255,.3);
}

/* BOTÓN */
.music-btn{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 24px;
    border:none;
    border-radius:30px;

    background:rgba(255,255,255,0.08);
    color:white;
    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:.3s;

    box-shadow:
    0 0 20px rgba(77,163,255,.15);
}

.music-btn:hover{
    transform:translateX(-50%) scale(1.05);
    background:rgba(255,255,255,0.15);
}

@media(max-width:700px){

    .title{
        font-size:2.5rem;
        top:40px;
    }

    .phrase{
        font-size:.8rem;
        padding:0 20px;
    }
}

</style>
</head>

<body>

<!-- AUDIO -->
<audio id="bgMusic" loop>
    <!-- EL MP3 DEBE ESTAR EN LA MISMA CARPETA -->
    <source src="here-for-you.mp3" type="audio/mpeg">
</audio>

<div class="stars"></div>

<div class="container">

    <div class="title">Nelly</div>

    <canvas id="heart"></canvas>

    <div class="phrase">
        “I’ll be here for you...” 💙
    </div>

</div>

<button class="music-btn" onclick="toggleMusic()">
    🎵 Iniciar 💙
</button>

<script>

/* ESTRELLAS */

const starsContainer = document.querySelector('.stars');

for(let i = 0; i < 180; i++){

    const star = document.createElement('div');

    star.classList.add('star');

    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';

    let size = Math.random() * 3;

    star.style.width = size + 'px';
    star.style.height = size + 'px';

    star.style.animationDuration =
    (Math.random() * 3 + 2) + 's';

    starsContainer.appendChild(star);
}

/* CANVAS */

const canvas = document.getElementById('heart');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];

function heartShape(t){

    const x = 16 * Math.pow(Math.sin(t),3);

    const y =
    13 * Math.cos(t)
    - 5 * Math.cos(2*t)
    - 2 * Math.cos(3*t)
    - Math.cos(4*t);

    return {
        x:x,
        y:y
    };
}

/* CREAR PARTÍCULAS */

for(let i = 0; i < 1600; i++){

    const t = Math.random() * Math.PI * 2;

    const pos = heartShape(t);

    particles.push({

        x: pos.x * 16,
        y: -pos.y * 16,

        size: Math.random() * 2 + .5,

        alpha: Math.random(),

        speed: Math.random() * .02 + .005
    });
}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();

    ctx.translate(canvas.width/2, canvas.height/2);

    particles.forEach(p => {

        p.alpha += p.speed;

        if(p.alpha >= 1 || p.alpha <= 0){

            p.speed *= -1;
        }

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(77,163,255,${p.alpha})`;

        ctx.shadowColor = '#4da3ff';
        ctx.shadowBlur = 15;

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });

    ctx.restore();

    requestAnimationFrame(animate);
}

animate();

/* AUDIO */

const music = document.getElementById("bgMusic");
const btn = document.querySelector(".music-btn");

function toggleMusic(){

    if(music.paused){

        music.play();

        btn.innerHTML = "⏸ Pausar";

    }else{

        music.pause();

        btn.innerHTML = "🎵 Iniciar";
    }
}

/* RESPONSIVE */

window.addEventListener('resize', ()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
